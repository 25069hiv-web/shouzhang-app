<style>
  /* ============================================================
     THEME TOKENS — 海底蓝主题 · 与原版完全一致
     ============================================================ */
  :root {
    /* ---- 页面与表面（海底青蓝） ---- */
    --page-bg: #edf5f8;
    --surface-card: #fcfefe;
    --surface-nested: #e6f1f6;

    /* ---- 边框 ---- */
    --border: #dbe8ee;
    --border-input: #c2d7e1;

    /* ---- 文本层级（深海蓝灰） ---- */
    --text: #15262f;
    --text-secondary: #54717d;
    --text-tertiary: #89a2ad;

    /* ---- 主色（深海水滴蓝） ---- */
    --accent: #2b6c8e;
    --accent-muted: #dcecf4;
    --on-accent: #f4fafc;

    /* ---- 模块色 ---- */
    --module-1: #5d9a7c;             /* 海草绿 — 收入 */
    --module-2: #4a8bb0;             /* 海水蓝 — 目标/趋势 */
    --module-3: #c79a4a;             /* 沙金 — 连续天数/星标 */
    --module-4: #d0794c;             /* 珊瑚橙 — 支出/记账 */
    --module-5: #7d8fc2;             /* 海雾紫 — AI */

    /* ---- 危险色 ---- */
    --danger: #c25d4f;
    --danger-muted: #f8ece9;

    /* ---- 抽屉（深海藏蓝面板） ---- */
    --drawer-bg: #13252e;
    --drawer-bg-top: #1d3844;
    --drawer-text: #eef6f9;
    --drawer-text-mute: rgba(238,246,249,.55);
    --drawer-hover: rgba(238,246,249,.1);
    --drawer-active: rgba(238,246,249,.09);

    /* ---- 皮肤 A：按用户指定顺序 + 用户微调（支出换派大星、目标换章鱼哥收银台） ---- */
    --hero-home-bg: url("assets/bg/beach.jpg");
    --hero-income-bg: url("assets/bg/hero-income-bg.jpg");   /* 章鱼哥绿底 contain+blur */
    --hero-expense-bg: url("assets/bg/hero-expense-bg.jpg");  /* 正義三人 contain+blur */
    --hero-ai-bg: url("assets/bg/ai-bg.jpg");
    --hero-goal-bg: url("assets/bg/cashier.jpg");

    /* ---- 皮肤 B：专业搭配（全家福/蟹老板/emo派大星/章鱼哥做梦/章鱼哥收银台） ---- */
    /* body.skin-b 见下方 */
    --page-texture: none;

    /* ---- 圆角 ---- */
    --radius-control: 8px;
    --radius-tile: 12px;
    --radius-card: 16px;
    --radius-sheet: 22px;

    /* ---- 阴影 ---- */
    --shadow-card: 0 1px 2px rgba(16,38,48,.04), 0 4px 14px rgba(16,38,48,.06);
    --shadow-overlay: 0 10px 28px rgba(16,38,48,.13);

    /* ---- 字体与布局 ---- */
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --nav-h: 62px;
  }

  /* ---- 皮肤 B：专业搭配 ---- */
  /* 首页用全家福（温暖亲切），收入保留蟹老板钱雨（完美匹配），支出换 emo 派大星（反讽搞笑），
     AI 用章鱼哥做梦（AI 本来就是帮你"做梦/畅想"），目标用章鱼哥收银台（认真上班和做梦形成镜像） */
  body.skin-b {
    --hero-home-bg: url("assets/bg/family.jpg");
    --hero-income-bg: url("assets/bg/moneyrain.jpg");
    --hero-expense-bg: url("assets/bg/patrick.jpg");
    --hero-ai-bg: url("assets/bg/ai-bg.jpg");
    --hero-goal-bg: url("assets/bg/cashier.jpg");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--module-2); outline-offset: 2px; border-radius: 4px; }
  button { -webkit-focus-ring-color: var(--module-2); }
  html, body { height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    max-width: 480px; margin: 0 auto; position: relative;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: var(--page-texture); background-size: cover; background-position: center; opacity:.5; }
  .app { padding: 0 16px calc(var(--nav-h) + 26px); }
  svg { display: block; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 14px 2px 12px; backdrop-filter: blur(10px);
    background: linear-gradient(180deg, color-mix(in srgb, var(--page-bg) 94%, transparent), color-mix(in srgb, var(--page-bg) 50%, transparent)); }
  .topbar .menu-btn { width: 38px; height: 38px; border: none; border-radius: var(--radius-tile); background: var(--surface-card);
    box-shadow: var(--shadow-card); display: grid; place-items: center; cursor: pointer; color: var(--text); transition: transform .15s; }
  .topbar .menu-btn:active { transform: scale(.92); }
  .topbar .title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; flex: 1; line-height: 1.2; }
  .topbar .title small { display:block; font-size: 11px; font-weight: 500; color: var(--text-secondary); letter-spacing:.02em; margin-top: 2px; }
  .date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- generic card / section ---------- */
  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size: 14px; font-weight: 700; margin: 24px 2px 12px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .sec-title .more { margin-left:auto; font-size: 12px; color: var(--text-secondary); font-weight: 500; cursor: pointer; display:inline-flex; align-items:center; gap:2px; }
  .sec-title .more svg { color: var(--text-tertiary); }

  /* ---------- greeting ---------- */
  .greet { position: relative; overflow: hidden; margin-top: 10px; padding: 16px 18px 18px; border-radius: var(--radius-card);
    border: 1px solid var(--border); box-shadow: var(--shadow-card);
    /* greet 卡：背景用图2海底城市远景，压缩高度让首页一屏可见 */
    background: var(--surface-nested) url("assets/bg/greet-banner.jpg") center center / cover no-repeat;
    height: 150px; }
  .greet > * { position: relative; z-index: 1; }
  .greet h1 { font-size: 26px; font-weight: 400; letter-spacing: -.03em; color: var(--text); }
  /* 文字颜色自适应背景图明暗：亮色背景用深色字，暗色背景用白色字 + 阴影 */
  .greet.bg-light h1 { color: #102029; text-shadow: 0 1px 2px rgba(255,255,255,.45); }
  .greet.bg-dark h1 { color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 0 14px rgba(0,0,0,.35); }
  .greet .add { position: absolute; top: 16px; right: 16px; z-index: 2; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; background: var(--accent); color:var(--on-accent);
    font-size: 13px; font-weight: 700; padding: 9px 15px 9px 12px; border-radius: 999px; box-shadow: var(--shadow-overlay);
    transition: transform .12s, filter .15s; }
  .greet .add:active { transform: scale(.95); filter: brightness(1.15); }
  .greet .add svg { margin-top: -1px; }

  /* ---------- quote card ---------- */
  .quote { margin-top: 16px; padding: 16px 18px; border-radius: var(--radius-card);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position: relative; }
  .quote::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size: 11px; font-weight: 700; color: var(--text-secondary);
    letter-spacing: .04em; margin-bottom: 9px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size: 16px; font-weight: 600; line-height: 1.55; color: var(--text); }

  /* ---------- overview rings ---------- */
  /* 三环卡：背景为三人物横版图，三环叠在图的下半部分，文字颜色对应所在人物颜色 */
  .card.rings { position: relative; overflow: hidden; padding: 0;
    border: 1px solid var(--border); box-shadow: none; border-radius: var(--radius-card);
    height: 168px;
    background-image: url("assets/bg/overview-bg.jpg");
    background-size: cover;
    background-position: center 12%;
    background-repeat: no-repeat; }
  /* 不使用底部渐变遮罩，避免圆角暗角；文字靠 text-shadow 保证可读 */
  .rings-row { position:absolute; left:0; right:0; bottom:0; z-index:1;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    padding: 0 8px 10px; }
  .ring { display:flex; flex-direction:column; align-items:center; gap: 2px; }
  .ring .dial { position: relative; width: 52px; height: 52px; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width: 52px; height: 52px; }
  /* 填充环用 overlay 混合模式，与背景图人物融合，产生"拼图填充"质感 */
  .ring .dial svg.gauge .ring-fill { mix-blend-mode: overlay; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  /* 三环：所有文字统一为白色 + 文字阴影，保证在背景图上可读 */
  .ring .pct { font-size: 15px; font-weight: 800; letter-spacing: -.02em; color: #ffffff;
    text-shadow: 0px 1px 2px rgba(0,0,0,0.5), 0px 0px 6px rgba(0,0,0,0.2); }
  .ring .lbl { font-size: 12px; color: #ffffff; font-weight: 800;
    text-shadow: 0px 1px 2px rgba(0,0,0,0.5), 0px 0px 6px rgba(0,0,0,0.2); }
  .ring .sub { font-size: 11px; color: #ffffff; opacity: .95; text-align:center;
    text-shadow: 0px 1px 2px rgba(0,0,0,0.5), 0px 0px 6px rgba(0,0,0,0.2); }
  /* 圆环中心图标 */
  .ring .dial .mid svg { color: #ffffff; filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.55)); }

  /* ---------- summary strip ---------- */
  .mod-summary { display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
  .mini { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile); box-shadow: var(--shadow-card); padding: 12px; }
  .mini .l { font-size: 11px; color: var(--text-secondary); }
  .mini .v { font-size: 20px; font-weight: 800; margin-top: 3px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  /* ---------- 记账页：月份切换条 ---------- */
  .monthbar { display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--surface-card); border:1px solid var(--border); border-radius: var(--radius-tile);
    box-shadow: var(--shadow-card); padding: 8px 10px; margin-bottom: 12px; }
  .mb-nav { width: 34px; height: 34px; border-radius: var(--radius-control); border:1px solid var(--border);
    background: var(--surface-card); color: var(--text); display:grid; place-items:center; cursor:pointer; transition: all .15s; }
  .mb-nav:active { background: var(--surface-nested); transform: scale(.94); }
  .mb-nav.prev svg { transform: rotate(180deg); }
  .mb-nav:disabled { opacity:.32; cursor:default; }
  .mb-cur { display:flex; align-items:center; gap:7px; font-size:15px; font-weight:800; letter-spacing:-.01em; font-variant-numeric: tabular-nums; }
  .mb-cur em { font-style:normal; font-size:10.5px; font-weight:700; color:var(--accent);
    background: var(--accent-muted); border-radius:999px; padding:2px 8px; }

  /* ---------- trend + quick record ---------- */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 14px; }
  .panel.trend-panel { margin-top: 12px; }
  .panel .ph { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:11px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height: auto; margin-top: 12px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:4px; padding: 0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height: 120px;
    color: var(--text-tertiary); font-size: 12px; margin-top: 8px; }
  .quick-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .qbtn { display:flex; flex-direction:column; align-items:center; gap:9px; padding: 15px 6px 12px; border:none; cursor:pointer;
    border-radius: var(--radius-tile); background: var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card);
    text-align:center; transition: transform .12s, border-color .15s, box-shadow .15s; }
  .qbtn:active { transform: scale(.95); border-color: var(--border-input); box-shadow: var(--shadow-overlay); }
  .qbtn .e { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); display:grid; place-items:center; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size: 12px; font-weight: 600; color: var(--text); }

  /* ---------- record list ---------- */
  .rec { position: relative; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile);
    box-shadow: var(--shadow-card); padding: 14px 14px; margin-bottom: 9px; transition: border-color .15s; }
  .rec:active { border-color: var(--border-input); }
  .rec .top { display:flex; align-items:center; gap: 11px; min-height: 44px; }
  .rec .body { flex:1; min-width:0; }
  .rec .rname { font-weight: 600; font-size: 14.5px; letter-spacing: -.01em; }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap: 7px; margin-top: 5px; align-items:center; }
  .rec .rnote { color: var(--text-secondary); font-size: 12.5px; margin-top: 7px; white-space: pre-wrap; line-height: 1.55; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge .dot { width:6px;height:6px;border-radius:50%;background:currentColor; }
  .rec .acts { position:absolute; top: 8px; right: 8px; display:flex; gap: 2px; z-index:3; }
  .rec .acts button { border:none; background:transparent; color: var(--text-tertiary); cursor:pointer;
    width: 30px; height: 30px; border-radius: var(--radius-control); display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background: var(--surface-nested); color: var(--module-3); }
  .rec .pin-btn.on { color: var(--module-3); }
  .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec .del:hover { background: var(--danger-muted); color: var(--danger); }
  .rec .pbar { height: 5px; border-radius:999px; background: var(--border); overflow:hidden; margin-top: 10px; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  /* 记账金额：垂直居中 + 避开右上角绝对定位按钮 */
  .rec .amt { font-size: 20px; font-weight: 800; letter-spacing:-.02em; white-space:nowrap; font-variant-numeric: tabular-nums;
    margin-right: 64px; }
  .rec .amt.exp { color: var(--module-4); }
  .rec .amt.inc { color: var(--module-1); }
  .rec .date-grp { font-size:11px; color:var(--text-tertiary); font-weight:700; padding: 10px 2px 6px; letter-spacing:.03em; }

  .empty { text-align:center; color: var(--text-secondary); padding: 48px 20px; }
  .empty .e { display:inline-grid; place-items:center; width: 58px; height:58px; border-radius: var(--radius-card); background: var(--surface-card); border:1px solid var(--border); color: var(--text-tertiary); margin-bottom: 14px; }

  /* per-module hero header */
  .hero { display:flex; align-items:center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position:relative; overflow:hidden; }
  .hero-ic { width: 36px; height: 36px; border-radius: var(--radius-tile); display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; display:flex; align-items:baseline; gap: 7px; flex-wrap:wrap; }
  .hero-v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero-l { font-size: 12px; color: var(--text-secondary); }
  .hero-bar { height: 5px; border-radius: 999px; background: var(--border); overflow:hidden; margin-top: 10px; }
  .hero-bar i { display:block; height:100%; border-radius:999px; }

  /* hero 带背景图的变体（用于收入 / 支出 / AI / 目标） */
  .hero-img { position: relative; overflow: hidden; padding: 16px 18px; border-radius: var(--radius-card);
    border: 1px solid var(--border); box-shadow: var(--shadow-card); min-height: 90px;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-color: var(--surface-nested); }
  .hero-img::before { content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background: linear-gradient(100deg, rgba(237,245,248,.28) 0%, rgba(237,245,248,.08) 35%, transparent 60%); }
  .hero-img::after  { content:""; position:absolute; left:0; right:0; bottom:0; height:20%; pointer-events:none; z-index:1;
    background: linear-gradient(to top, rgba(237,245,248,.28) 0%, transparent 100%); }
  .hero-img > * { position: relative; z-index: 2; }
  .hero-img .hero-v { font-size: 24px; text-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hero-img .hero-l { color: var(--text-secondary); }
  /* 收入 hero 强调绿色文字，支出 hero 强调珊瑚橙 */
  .hero-img[data-kind="income"] .hero-v { color: var(--module-1); }
  .hero-img[data-kind="expense"] .hero-v { color: var(--module-4); }
  .hero-img[data-kind="ai"] .hero-v { color: var(--module-5); }
  .hero-img[data-kind="goal"] .hero-v { color: var(--module-2); }

  /* 模块页独立 header（不复用首页 greet 卡，避免首页/记账本长得一样） */
  .module-header { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: 14px 16px; background: var(--surface-card); border:1px solid var(--border);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card); margin-top: 10px; }
  .mh-title { font-size: 17px; font-weight: 800; letter-spacing: -.01em; color: var(--text);
    display:flex; align-items:center; gap:6px; }
  .mh-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .mh-actions { display:flex; gap: 8px; flex:0 0 auto; }
  .mh-btn { width: 38px; height: 38px; border-radius: var(--radius-tile); border: 1px solid var(--border-input);
    background: var(--surface-card); color: var(--text-secondary); display:grid; place-items:center;
    cursor:pointer; box-shadow: var(--shadow-card); transition: transform .12s, background .15s; }
  .mh-btn:active { transform: scale(.92); }
  .mh-btn-add { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .mh-btn-ai  { background: var(--module-5); border-color: var(--module-5); color: #fff; }

  /* ---------- bottom nav ---------- */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; height: var(--nav-h);
    background: rgba(252,254,254,.94); backdrop-filter: blur(14px); border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(4,1fr); align-items: center; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .nav .n { display:flex; flex-direction:column; align-items:center; gap: 2px; cursor:pointer; color: var(--text-tertiary); font-size: 10px; font-weight: 500;
    position: relative; padding-top: 4px; transition: color .18s; }
  .nav .n.active { color: var(--accent); font-weight: 700; }
  .nav .n.active::after { content:""; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); position:absolute; top: 2px; left: 50%; transform: translateX(-50%); }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--text) 42%, transparent); backdrop-filter: blur(2px); z-index: 40; opacity:0; pointer-events:none; transition: opacity .22s; }
  .scrim.show { opacity:1; pointer-events:auto; }

<script>
/* ============================================================
   CONFIG — 唯一需要定制的地方。
   ============================================================ */
const CONFIG = {
  storageKey: "wb-minimal-v4",         // v4: 圆环美化 + 干净种子数据
  owner: "我的手账",
  slogan: "PURE & OFFLINE",
  brand: "我",

  quotes: [
    "每一笔进出都是自己的脚印。",           // 周一
    "小金额也会慢慢长成大山。",             // 周二
    "赚钱和省钱，都是本事。",               // 周三
    "记下来，才看得见钱花去哪了。",         // 周四
    "别让月底翻账本时只剩下叹气。",         // 周五
    "给辛苦的自己留点预算。",               // 周六
    "复盘一下，下周继续。",                 // 周日
  ],

  // 底部导航对应的 3 个核心模块概览
  // 圆环填充色：半透明 + 各自马卡龙色调，与背景图融合；底层用 mix-blend-mode: overlay 实现拼图感
  overview: [
    { key: "todayInc", label: "今日收入", icon: "wallet", ringFill: "rgba(200, 240, 215, 0.55)",
      calc: d => { const mk=isoToday(); const t=(d.money||[]).filter(x=>x.date===mk&&x.type==="income").reduce((s,x)=>s+ +x.amount,0);
        return { value: t?100:0, sub: t?`¥${t}`:"—" }; } },
    { key: "todayExp", label: "今日支出", icon: "chart", ringFill: "rgba(255, 225, 210, 0.55)",
      calc: d => { const mk=isoToday(); const t=(d.money||[]).filter(x=>x.date===mk&&x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
        const B=100; return { value: Math.min(100, Math.round(t/B*100)), sub: t?`¥${t}`:"—" }; } },
    { key: "goal", label: "目标进度", icon: "target", ringFill: "rgba(200, 228, 245, 0.55)",
      calc: d => avgProgress(d.goal) },
  ],

  trend: {
    title: "本周支出", unit: "元",
    series: d => {
      const now=new Date(), dow=(now.getDay()+6)%7;
      const mon=new Date(now); mon.setDate(now.getDate()-dow); mon.setHours(0,0,0,0);
      const pad=n=>String(n).padStart(2,'0');
      const arr=[];
      for(let i=0;i<7;i++){ const dt=new Date(mon); dt.setDate(mon.getDate()+i);
        const key=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
        arr.push((d.money||[]).filter(x=>x.type==='expense'&&x.date===key).reduce((s,x)=>s+ +x.amount,0)); }
      return arr.some(v=>v>0) ? arr : [];
    },
  },

  quickAdd: [
    { label: "记一笔", icon: "wallet", module: "money", tint: "#fbeee6", color: "var(--module-4)" },
    { label: "加目标", icon: "target", module: "goal",  tint: "#e4eef5", color: "var(--module-2)" },
    { label: "语音记账", icon: "mic",    module: "ai",    tint: "#eceef8", color: "var(--module-5)" },
    { label: "类别设置", icon: "gear",   module: "cats",  tint: "#e7f0f4", color: "var(--accent)" },
  ],

  // ============ 模块定义 ============
  modules: [
    {
      key: "money", name: "记账本", icon: "wallet", tint: "#fbeee6", color: "var(--module-4)",

        { id: 52, title: "阿超", type: "expense", amount: 30.00, category: "其他", date: "2026-10-14" },

        { id: 54, title: "雪糕", type: "expense", amount: 2.00, category: "餐饮", date: "2026-10-14" },
        // 昨日 2026-10-13 收入
        { id: 55, title: "京东", type: "income", amount: 60.00, category: "兼职", date: "2026-10-13" },
      ],
    },
    {
      key: "goal", name: "长期目标", icon: "target", tint: "#e4eef5", color: "var(--module-2)",
      type: "progress", unit: "", desc: "把大目标拆成能推进的小步",
      seed: [
        { id: 31, title: "贷款", current: 0, target: 2800, unit: "元", note: "还清贷款" },
        { id: 32, title: "存下1万元", current: 2100, target: 10000, unit: "元", note: "每月固定转入" },

    },

};

/* ============================================================
   NLP 关键词表 — 本地 AI 靠它理解你在说什么
   （不联网，全部写死在代码里，用户也可以自己改）
   ============================================================ */
const NLP = {
  // 收支方向：关键词 → type
  incomeKeywords: ["工资","薪水","收入","稿费","兼职","奖金","红包","转账","报销","分红","利息","零花钱","返现","返利","中奖"],

  // 类别关键词（每个类别下挂若干触发词）
  categoryKeywords: {
    "餐饮": ["吃","饭","餐","外卖","午餐","晚餐","早餐","咖啡","奶茶","饮料","小吃","烧烤","火锅","甜品","水果","买菜","食材"],

/* 底环用极度透明的白色（0.2），填充环用半透明马卡龙色 + mix-blend-mode 实现拼图融合 */
function ringSVG(pct, fillColor){

  const trackColor = "rgba(255,255,255,0.2)";
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="${trackColor}" stroke-width="5.5"/>
    <circle class="ring-fill" cx="30" cy="30" r="${r}" fill="none" stroke="${fillColor}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series,1), min=Math.min(...series,0);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${series[i]>0?3:0}" fill="#fff" stroke="var(--module-4)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-4)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-4)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-4)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- donut chart ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

/* 根据 greet 背景图的亮度自动选择文字颜色（亮背景→深色字，暗背景→白色字） */
function adaptGreetTextColor(){
  const greet = document.querySelector(".greet");
  if(!greet) return;
  const bg = getComputedStyle(greet).backgroundImage;
  const m = bg.match(/url\(["']?([^"')]+)["']?\)/);
  const src = m ? m[1] : null;
  if(!src) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = ()=>{
    const c = document.createElement("canvas");
    const w = c.width = img.naturalWidth, h = c.height = img.naturalHeight;
    const ctx = c.getContext("2d", { willReadFrequently:true });
    ctx.drawImage(img, 0, 0, w, h);
    // 采样文字所在区域（左上 1/3 宽、上半部分高）
    try {
      const sx = 0, sy = 0, sw = Math.floor(w/3), sh = Math.floor(h/2);
      const data = ctx.getImageData(sx, sy, sw, sh).data;
      let r=0, g=0, b=0, n=0;
      for(let i=0; i<data.length; i+=16){ // 每 4 像素采一个，加速
        r += data[i]; g += data[i+1]; b += data[i+2]; n++;
      }
      r/=n; g/=n; b/=n;
      const brightness = 0.299*r + 0.587*g + 0.114*b;
      greet.classList.toggle("bg-light", brightness > 128);
      greet.classList.toggle("bg-dark", brightness <= 128);
    } catch(e){ /* 跨域/读取失败时回退默认色 */ }
  };
  img.onerror = ()=>{ /* 加载失败时使用默认色 */ };
  img.src = src;
}

/* ---------- MODULE VIEW ---------- */
function groupByDate(items){
  if(!items.length) return [];
  const groups = {};
  const today = isoToday();
  const yday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  items.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))
    .forEach(x => { const k = x.date || today; if(!groups[k]) groups[k] = []; groups[k].push(x); });
  return Object.keys(groups).sort().reverse().map(k => {
    let label = k;
    if(k === today) label = "今天 · " + k;
    else if(k === yday) label = "昨天 · " + k;
    return { label, items: groups[k] };
  });
}

function headHero(m, big, label, pct, opts){
  const useBg = opts && opts.bg;
  const kindCls = useBg ? 'hero-img' : 'hero';
  const kindData = (opts && opts.kind) ? ` data-kind="${opts.kind}"` : '';
  const bgStyle = useBg ? ` style="background-image:${opts.bg}, var(--surface-nested)"` : '';
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
    <div style="flex:1;min-width:0"><div class="hero-tx"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div>
    ${pct!=null?`<div class="hero-bar"><i style="width:${Math.min(100,pct)}%;background:${m.color}"></i></div>`:''}</div>`;
  return `<div class="${kindCls}"${kindData}${bgStyle}>${inner}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;

  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec"><div class="top" style="align-items:flex-start">${acts}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}</div></div></div>`;
  }
  if(m.type==="finance"){
    const inc=x.type==="income";
    return `<div class="rec"><div class="top">
      <div class="body" data-edit="${x.id}">
        <div class="rname">${esc(x.title)}</div>
        <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span>
        <span style="color:var(--text-secondary);font-size:12px">${(x.date||'').slice(5)}</span></div>
      </div>
      <div class="amt ${inc?'inc':'exp'}">${inc?'+':'-'}¥${(+x.amount).toFixed(2)}</div>
      ${acts}
    </div></div>`;
  }
  return `<div class="rec"><div class="top"><div class="body">${esc(x.title||'无标题')}</div>${acts}</div></div>`;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  const addAi=$("#btn-add-ai"); if(addAi) addAi.onclick=()=>go("ai");
  // 月份切换（记账页）
  const mbPrev=$("#mbPrev"); if(mbPrev) mbPrev.onclick=()=>{ MONEY.month=shiftMonth(MONEY.month,-1); renderModule(key); window.scrollTo({top:0}); };
  const mbNext=$("#mbNext"); if(mbNext) mbNext.onclick=()=>{ MONEY.month=shiftMonth(MONEY.month,1); renderModule(key); window.scrollTo({top:0}); };
}

/* ---------- EDITOR MODAL ---------- */
function openEditor(key, item){
  const m=modOf(key); const editing=!!item;
  const d = item || newItem(m);
  let fields="";
  if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    const cats = getMoneyCategories();
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" step="0.01" value="${d.amount??''}" placeholder="0.00"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${cats.map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else {
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}"/></div>`;
  }

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||"其他"; d.date=val("#f-date")||isoToday(); }
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  if(m.type==="progress") return {...base, title:"", current:0, target:20, unit:m.unit||"", note:""};
  if(m.type==="finance") return {...base, title:"", type:"expense", amount:"", category:(getMoneyCategories()[0])||"其他", date:isoToday()};
  return {...base, title:""};
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

function openCategorySettings(){
  const cur = getMoneyCategories();
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>收支类别</h2>
    <div class="sub">这些类别会出现在记账弹窗里。点右侧 X 删除，底部输入框可新增。</div>
    <div id="catList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px"></div>
    <div class="frow"><div class="field" style="flex:1"><input id="newCat" placeholder="输入新类别名，回车添加"/></div>
    <button class="btn" id="addCat" style="flex:0 0 auto;padding:11px 16px">添加</button></div>
    <div class="modal-actions"><button class="btn ghost" id="closeCat">完成</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#closeCat").onclick=close;

  function render(){
    const list = overlay.querySelector("#catList");
    list.innerHTML = cur.map((c,i)=>`<span class="seg opt" style="flex:0 0 auto;padding:8px 12px;display:inline-flex;align-items:center;gap:6px">
      ${esc(c)} <button data-del="${i}" style="border:none;background:transparent;color:var(--danger);cursor:pointer;padding:0;font-size:16px;line-height:1">×</button></span>`).join("");
    list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ cur.splice(+b.dataset.del,1); save(); render(); });
  }
  function save(){ if(!data.__cats) data.__cats = {}; data.__cats.money = cur.filter(c => !(modOf("money").categories||[]).includes(c)); store.save(); }

  const input = overlay.querySelector("#newCat");
  const add = () => { const v = input.value.trim(); if(v && !cur.includes(v)) { cur.push(v); save(); render(); } input.value=""; };
  overlay.querySelector("#addCat").onclick = add;
  input.onkeydown = e => { if(e.key==="Enter") { e.preventDefault(); add(); } };
  render();
}

/* ---------- INSIGHT ---------- */
function renderInsight(){
  const DONUT_COLORS=["var(--module-4)","var(--module-3)","var(--module-5)","var(--module-2)","var(--module-1)","var(--danger)","var(--text-tertiary)"];

  // 收入/支出/目标 三条进度条
  const money = data.money||[];
  const goals = data.goal||[];
  const today = isoToday();
  const mk = today.slice(0,7);
  const weekStart = (() => {
    const now=new Date(); const dow=(now.getDay()+6)%7;
    const mon=new Date(now); mon.setDate(now.getDate()-dow); mon.setHours(0,0,0,0);
    return mon.toISOString().slice(0,10);
  })();

  const tInc = money.filter(x=>x.date===today&&x.type==="income").reduce((s,x)=>s+ +x.amount,0);
  const tExp = money.filter(x=>x.date===today&&x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
  const mExp = money.filter(x=>x.type==="expense"&&(x.date||"").slice(0,7)===mk).reduce((s,x)=>s+ +x.amount,0);
  const wExp = money.filter(x=>x.type==="expense"&&x.date>=weekStart&&x.date<=today).reduce((s,x)=>s+ +x.amount,0);
  const gPct = avgProgress(goals).value;

  const bars = [
    { label:"今日收入", v:tInc, pct:Math.min(100,tInc>0?100:0), color:"var(--module-1)" },
    { label:"今日支出", v:tExp, pct:Math.min(100,Math.round(tExp/200*100)), color:"var(--module-4)" },
    { label:"本月支出", v:mExp, pct:Math.min(100,Math.round(mExp/3000*100)), color:"var(--module-4)" },
    { label:"本周支出", v:wExp, pct:Math.min(100,Math.round(wExp/1000*100)), color:"var(--module-2)" },
    { label:"目标进度", v:gPct+"%", pct:gPct, color:"var(--module-2)" },
  ];
  const barList = bars.map(b=>`<div class="bar-row">
    <span class="bar-name">${b.label}</span>
    <div class="pbar"><i style="width:${b.pct}%;background:${b.color}"></i></div>
    <span class="bar-pct">${typeof b.v==='number'?'¥'+b.v.toFixed(0):b.v}</span></div>`).join("");

  // 支出构成 donut
  const exps = money.filter(x=>x.type==="expense" && (x.date||"").slice(0,7)===mk);
  const totalExp = exps.reduce((s,x)=>s+ +x.amount,0);
  const cats = getMoneyCategories();
  let segs = cats.map(c=>({ cat:c, amount: exps.filter(x=>x.category===c).reduce((s,x)=>s+ +x.amount,0) }))
    .filter(s=>s.amount>0).sort((a,b)=>b.amount-a.amount);
  segs.forEach((s,i)=>s.color=DONUT_COLORS[i%DONUT_COLORS.length]);
  const donut = segs.length ? donutSVG(segs) : `<div class="donut-empty">${icon("wallet",22)}<span>暂无</span></div>`;
  const legend = segs.map(s=>{ const p=totalExp?Math.round(s.amount/totalExp*100):0;
    return `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>
      <span class="legend-name">${esc(s.cat)}</span><span class="legend-amt">¥${s.amount.toFixed(0)}</span><span class="legend-pct">${p}%</span></div>`; }).join("");

  $("#screen").innerHTML = `<div class="greet"><div><h1>洞察</h1><p>各模块进展一览 · 记账—统计—复盘</p></div></div>
    <div class="sec-title">进度一览</div>
    <div class="panel"><div class="ph">${icon("chart",15)} 关键指标</div>
      <div class="bar-list">${barList}</div></div>
    <div class="sec-title">本月支出构成</div>
    <div class="panel"><div class="ph">${icon("wallet",15)} 支出构成<span class="avg">合计 ¥${totalExp.toFixed(0)}</span></div>
      <div class="donut-wrap"><div class="donut">${donut}${segs.length?`<span class="donut-mid">¥${totalExp.toFixed(0)}</span>`:''}</div>
        <div class="donut-legend">${legend}</div></div></div>`;
}

/* ---------- export / import ---------- */
function exportData(){
  const payload = {
    _app: "我的手账",
    _ver: 3,
    _exported: new Date().toISOString(),
    storage: {}
  };
  // 保存当前 app 的 localStorage 数据
  const keys = Object.keys(localStorage);
  keys.forEach(k => {
    try { payload.storage[k] = JSON.parse(localStorage.getItem(k)); }
    catch { payload.storage[k] = localStorage.getItem(k); }
  });
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `我的手账_备份_${ts}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast("已导出 " + ts);
}
function importData(){
  $("#importInput").value = "";
  $("#importInput").onchange = e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        if(!payload || typeof payload !== "object" || !payload.storage) {
          toast("文件格式不对"); return;
        }
        // 覆盖写入 localStorage
        Object.keys(payload.storage).forEach(k => {
          const v = payload.storage[k];
          localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
        });
        // 重新加载 data 并渲染
        data = store.load();
        if(data.__avatar) $("#brandImg").src = data.__avatar;
        initSkin();
        render();
        toast("已导入 " + f.name);
      } catch(err) {
        toast("导入失败：" + err.message);
      }
    };
    reader.readAsText(f);
  };
  $("#importInput").click();
}


/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ============================================================
   本地 NLP — 解析自然语言记账
   ============================================================ */
function parseAmount(text){
  // 先试阿拉伯数字：¥50 / 50元 / 50块 / 50.5 / 一百 / 五十 / 五十块
  // 去掉开头的 ¥ $ ￥
  const cleaned = text.replace(/[¥$￥]/g, "");
  // 匹配阿拉伯数字（支持小数）
  const m = cleaned.match(/(\d+(?:\.\d+)?)/);
  if(m) return parseFloat(m[1]);
  // 中文数字
  const cnMatch = cleaned.match(/([零一二两三四五六七八九十百千万壹贰叁肆伍陆柒捌玖拾佰仟萬]+)[块元]?/);
  if(cnMatch) return parseCN(cnMatch[1]);
  return null;
}
function parseCN(s){
  let result = 0, current = 0;
  for(const ch of s){
    const v = NLP.cnNums[ch];
    if(v !== undefined){
      if(ch === '十' && current === 0) current = 10;
      else current = v;
    } else if(ch === '百'){ result += current * 100; current = 0; }
    else if(ch === '千'){ result += current * 1000; current = 0; }
    else if(ch === '万'){ result = (result + current) * 10000; current = 0; }
  }
  return result + current;
}

function detectType(text){
  for(const k of NLP.incomeKeywords) if(text.includes(k)) return "income";
  for(const k of NLP.expenseKeywords) if(text.includes(k)) return "expense";
  // 动词线索：花了/用了/买/付 → 支出；收到/发了/赚了 → 收入
  if(/花了|用了|买了|付了|扣了/.test(text)) return "expense";
  if(/收到|发了|赚了|到账/.test(text)) return "income";
  return "expense"; // 默认支出
}

function detectCategory(text, type){
  const cats = getMoneyCategories();
  // 先在用户自定义类别里找精确匹配
  for(const c of cats) if(text.includes(c)) return c;
  // 再在关键词表里找
  for(const [cat, kws] of Object.entries(NLP.categoryKeywords)){
    if(cats.includes(cat)){
      for(const kw of kws) if(text.includes(kw)) return cat;
    }
  }
  return "其他";
}

function detectTitle(text, amount){
  // 去掉金额部分剩下的当标题
  let t = text.replace(/[¥$￥]/g, "").replace(/\d+(?:\.\d+)?/g, "").replace(/[块元]/g, "");
  t = t.replace(/[零一二两三四五六七八九十百千万壹贰叁肆伍陆柒捌玖拾佰仟萬]+/g, "").trim();
  // 去掉收支方向词
  t = t.replace(/^(花了|用了|买了|付了|扣了|收到|发了|赚了|到账了|记|我)/, "").trim();
  return t || (detectType(text)==="income" ? "收入" : "支出");
}

function aiMsgHTML(m, i){

  const body = m.streaming ? `<div class="ai-dots"><i></i><i></i><i></i></div>` : `<p>${esc(m.content)}</p>`;

  return `<div class="ai-msg ai"><div class="ai-ava">${icon("bolt",16)}</div>
    <div class="ai-bubble">${body}${confirmBox}${errBox}${AI.busy&&m.streaming?'<span class="ai-cursor"></span>':''}</div></div>`;

function aiConfirmHTML(parsed, msgIdx){

function wireAI(){
  const newBtn=$("#aiNewBtn"); if(newBtn) newBtn.onclick=()=>{ AI.msgs=[]; renderAI(); };

  // 皮肤切换按钮（AI 页 hero 右上角）
  const skT = $("#skinToggle"); if(skT) skT.onclick=toggleSkin;

  const input=$("#aiInput");
  const autoGrow=()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,96)+"px"; };
  input.oninput=autoGrow;
  input.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); aiSend(input.value); } };
  $("#aiSend").onclick=()=>aiSend(input.value);
  $("#aiMic").onclick=()=>toggleMic();

  $("#screen").querySelectorAll(".ai-qchip").forEach(b=>{
    b.onclick=()=>aiSend(b.textContent.trim());

  $("#screen").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const idx=+b.dataset.edit; openAIParserEditor(idx); });

function aiSend(text){
  text=(text||"").trim();
  if(!text||AI.busy) return;
  const input = $("#aiInput"); if(input) input.value="";
  AI.msgs.push({ role:"user", content:text, ts:Date.now() });
  renderAI();
  setTimeout(()=>runAILocal(text), 100);
}

function runAILocal(text){
  AI.busy = true;
  // 加一个"思考中"气泡，营造智能感
  AI.msgs.push({ role:"assistant", content:"", streaming:true });
  renderAI();
  const curIdx = AI.msgs.length - 1;

  setTimeout(() => {
    const lower = text.toLowerCase();
    let reply = null, confirm = null, err = null;

    // —— 分析类指令 ——
    if(/分析|看看|花在哪|花在哪最多|构成|汇总|统计/.test(text) && /本月|这周|本周|今天/.test(text)){
      reply = buildAnalysis(text);
    } else if(/今天花了多少|今天花|今日支出|今天支出/.test(text)){
      reply = buildAnalysis("今天支出");
    } else if(/最近三笔|最近.*笔|上一笔|最新/.test(text)){
      reply = buildRecent(3);
    } else if(/本月花在哪最多/.test(text)){
      reply = buildTopCategory();
    }
    // —— 记账指令 ——
    else {
      const amount = parseAmount(text);
      if(amount == null){
        err = "没识别到金额哦，试试说「午餐二十块」或「工资八千」这样的格式。";
      } else {
        const type = detectType(text);
        const category = detectCategory(text, type);
        const title = detectTitle(text, amount);
        confirm = { type, amount, category, title, date: isoToday() };
        reply = `识别到一笔${type==="income"?"收入":"支出"}，帮你核对一下：`;
      }
    }

    AI.msgs[curIdx] = { role:"assistant", content:reply||"", confirm, err };
    AI.busy = false;
    renderAI();
  }, 600); // 轻微延迟，像在思考
}

function buildAnalysis(query){
  const mk = isoToday().slice(0,7);
  const today = isoToday();
  const m = data.money||[];
  const isToday = /今天|今日/.test(query);
  const isMonth = /本月|这个月/.test(query);
  const isWeek = /这周|本周/.test(query);

  let recs, label;
  if(isToday){ recs = m.filter(x=>x.date===today); label="今天"; }
  else if(isWeek){
    const now=new Date(); const dow=(now.getDay()+6)%7;
    const mon=new Date(now); mon.setDate(now.getDate()-dow); mon.setHours(0,0,0,0);
    const ks = mon.toISOString().slice(0,10);
    recs = m.filter(x=>x.date>=ks&&x.date<=today); label="本周";
  } else { recs = m.filter(x=>(x.date||"").slice(0,7)===mk); label="本月"; }

  if(!recs.length) return `**${label}** 还没有任何记录，记一笔再来问我吧。`;
  const inc = recs.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
  const exp = recs.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
  const catMap = {};
  recs.filter(x=>x.type==="expense").forEach(x=>{ catMap[x.category||"其他"] = (catMap[x.category||"其他"]||0) + +x.amount; });
  const top = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,3);

  let out = `**${label}** 共 ${recs.length} 笔 · 收 **¥${inc.toFixed(0)}** · 支 **¥${exp.toFixed(0)}**`;
  if(exp>0){
    out += `\n\n支出 Top ${Math.min(3,top.length)}：\n`;
    top.forEach(([c,v],i)=>{ out += `${i+1}. ${c} — ¥${v.toFixed(0)}（${Math.round(v/exp*100)}%）\n`; });
  }
  return out.trim();
}

function buildRecent(n){
  const m = data.money||[];
  const recent = m.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,n);
  if(!recent.length) return "还没有记账，先记一笔再来问。";
  return recent.map((x,i)=>`${i+1}. ${x.date||""} ${x.title} · ${x.category||""} · ${x.type==="income"?"+":"-"}¥${(+x.amount).toFixed(2)}`).join("\n");
}

function buildTopCategory(){
  const mk = isoToday().slice(0,7);
  const m = data.money||[];
  const recs = m.filter(x=>x.type==="expense"&&(x.date||"").slice(0,7)===mk);
  if(!recs.length) return "本月还没有支出记录。";
  const catMap = {};
  recs.forEach(x=>{ catMap[x.category||"其他"] = (catMap[x.category||"其他"]||0) + +x.amount; });
  const [topCat, topAmt] = Object.entries(catMap).sort((a,b)=>b[1]-a[1])[0];
  const total = recs.reduce((s,x)=>s+ +x.amount,0);
  return `本月支出 **¥${topAmt.toFixed(0)}** 花在了 **${topCat}**（占 ${Math.round(topAmt/total*100)}%），是不是该看看这里面有没有可以省的？`;
}

function saveAIParsed(msgIdx){
  const m = AI.msgs[msgIdx];
  if(!m || !m.confirm) return;
  const p = m.confirm;
  const item = { id: Date.now(), title: p.title, type: p.type, amount: +p.amount, category: p.category, date: p.date };
  (data.money = data.money || []).unshift(item);
  store.save();
  // 替换掉确认卡
  m.content = `已保存 ✓ ${p.type==="income"?"收入":"支出"} ${p.title} ¥${(+p.amount).toFixed(2)}（${p.category}）`;
  m.confirm = null; m.err = null;
  renderAI();
}

function cycleCategory(msgIdx){
  const m = AI.msgs[msgIdx]; if(!m || !m.confirm) return;
  const cats = getMoneyCategories();
  const idx = cats.indexOf(m.confirm.category);
  m.confirm.category = cats[(idx+1) % cats.length];
  renderAI();
}

  const m = AI.msgs[msgIdx]; if(!m || !m.confirm) return;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>

    <div class="field"><label>类型</label><div class="seg" id="f-ftype">
      <div class="opt ${p.type==='expense'?'on':''}" data-v="expense">支出</div>
      <div class="opt ${p.type==='income'?'on':''}" data-v="income">收入</div></div></div>
    <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(p.title)}"/></div>
    <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" step="0.01" value="${p.amount}"/></div></div>
    <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${getMoneyCategories().map(c=>`<div class="opt ${c===p.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
    <div class="field"><label>日期</label><input id="f-date" type="date" value="${p.date}"/></div>
    <div class="modal-actions"><button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">更新</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  overlay.querySelector("#m-save").onclick=()=>{
    p.type = overlay.querySelector("#f-ftype .on").dataset.v;
    p.title = (overlay.querySelector("#f-title").value||"").trim()||"未命名";
    p.amount = +overlay.querySelector("#f-amt").value || 0;
    p.category = overlay.querySelector("#f-cat .on").dataset.v;
    p.date = overlay.querySelector("#f-date").value || isoToday();
    close(); renderAI();
  };
}

/* ---------- Web Speech API ---------- */
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    // 兜底：如果浏览器不支持，弹个提示
    alert("当前浏览器不支持语音识别。Chrome / Edge / 三星浏览器都支持，建议换一个。");
    return;
  }
  if(AI.micOn){
    if(AI.rec) { try { AI.rec.stop(); } catch(e){} }
    AI.micOn = false; renderAI();
    return;
  }
  AI.micOn = true; renderAI();

  const rec = new SR();
  rec.lang = "zh-CN";
  rec.interimResults = true;
  rec.continuous = false;
  AI.rec = rec;

  rec.onresult = e => {
    let final = "", interim = "";
    for(let i=0;i<e.results.length;i++){
      const r = e.results[i];
      if(r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    const text = (final || interim).trim();
    if(final){
      // 识别完成，直接发出去
      AI.micOn = false; AI.rec = null;
      // 在输入框里塞一下再发送，让用户看到
      const input = $("#aiInput"); if(input) input.value = text;
      renderAI();
      setTimeout(()=>aiSend(text), 50);
    }
  };
  rec.onerror = e => {
    console.warn("语音识别错误", e.error);
    AI.micOn = false; AI.rec = null; renderAI();
  };
  rec.onend = () => {
    AI.micOn = false; AI.rec = null; renderAI();
  };

  try { rec.start(); } catch(err) { AI.micOn=false; renderAI(); }
}
